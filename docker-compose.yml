services:
  # 2. BACKEND
  api_server:
    build: ./backend
    env_file:
      - ./backend/.env
    ports:
      - "8081:8080"

  # 3. FRONTEND
  client_app:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api_server
    volumes:
      - ./frontend:/app
      - /app/node_modules
